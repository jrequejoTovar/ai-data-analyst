<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}AI Data Analyst{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/dompurify@3.2.6/dist/purify.min.js"></script>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/main.css') }}">
</head>
<body>
<header class="topbar">
    <div class="brand">

        <!-- Logo JRT: LinkedIn -->
        <a
            href="https://www.linkedin.com/in/jaimerequejotovar/"
            class="brand-mark brand-mark-ie"
            target="_blank"
            rel="noopener noreferrer"
            title="Visit my LinkedIn profile"
        >
            <img
                src="{{ url_for('static', filename='images/JRT_Badge.png') }}"
                alt="Jaime Requejo Tovar"
            >
        </a>

        <!-- Application title -->
        <a href="{{ url_for('analyst') }}" class="brand-title">
            <strong>AI DATA ANALYST</strong>
            <small>Evidence-based local analytics</small>
        </a>

    </div>

    <nav>
        <a class="active" href="{{ url_for('analyst') }}">Analyst</a>
        <a href="{{ url_for('admin') }}">Admin</a>
    </nav>

    <span class="local-status"><i></i> Local AI</span>
</header>

{% block content %}{% endblock %}
{% block scripts %}{% endblock %}
</body>
</html>
