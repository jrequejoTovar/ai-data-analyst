<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}AI Data Analyst{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/dompurify@3.2.6/dist/purify.min.js"></script>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/main.css') }}">
</head>
<body>
<header class="topbar">
    <a class="brand" href="{{ url_for('analyst') }}">
        <span class="brand-mark brand-mark-ie">
            <img
                src="{{ url_for('static', filename='images/ie-university-logo.svg') }}"
                alt="IE University"
            >
        </span>
        <span>
            <strong>AI DATA ANALYST</strong>
            <small>Evidence-based local analytics</small>
        </span>
    </a>
    <nav>
        <a class="active" href="{{ url_for('analyst') }}">Analyst</a>
        <a href="{{ url_for('admin') }}">Admin</a>
    </nav>
    <span class="local-status"><i></i> Local AI</span>
</header>

{% block content %}{% endblock %}
{% block scripts %}{% endblock %}
</body>
</html>
