services:
  postgres:
    image: docker.io/postgres:17
    container_name: ai-analyst-postgres

    environment:
      POSTGRES_DB: ai_analyst
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d:ro
      - ./database/data:/data:ro

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d ai_analyst"]
      interval: 5s
      timeout: 5s
      retries: 10

  postgres-mcp:
    build:
      context: ./pg-airman-mcp

    container_name: ai-analyst-postgres-mcp

    environment:
      AIRMAN_MCP_DATABASE_URL: postgresql://ai_analyst:ai_analyst_readonly@postgres:5432/ai_analyst
      AIRMAN_MCP_ACCESS_MODE: restricted
      AIRMAN_MCP_TRANSPORT: streamable-http
      AIRMAN_MCP_STREAMABLE_HTTP_HOST: 0.0.0.0
      AIRMAN_MCP_STREAMABLE_HTTP_PORT: 8001
      ALLOW_COMMENT_IN_RESTRICTED: "false"

    ports:
      - "8001:8001"

    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data: